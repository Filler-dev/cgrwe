<form method="GET" class="es-color-form">
    <div class="es-color-form__content">
        <p class="es-color-form__copy">
            Test many foreground and background color combos for compliance with <a href="https://www.w3.org/TR/UNDERSTANDING-WCAG20/visual-audio-contrast-contrast.html">WCAG 2.0 minimum contrast</a>.
        </p>
        <p class="es-color-form__copy">
            Include one color per line, with an optional comma-separated label.
        </p>
        <div class="es-color-form__field-wrapper es-color-form__field-wrapper--background-colors">
            <label for="es-color-form__background-colors" class="es-color-form__label">Rows</label>
            <textarea id="es-color-form__background-colors" name="background-colors" class="es-color-form__textarea" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Enter HEX color values, one color per line"></textarea>
        </div>
        <div class="es-color-form__field-wrapper">
            <label for="es-color-form__foreground-colors" class="es-color-form__label">Rows &amp; Columns</label>
            <textarea id="es-color-form__foreground-colors" name="foreground-colors" class="es-color-form__textarea" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Enter HEX color values, one color per line">
#FFFFFF, White
#F2F2F2
#DDDDDD
#CCCCCC
#888888
#404040, Charcoal
#000000, Black
#2F78C5, Effective on Extremes
#0F60B6, Effective on Lights
#398EEA, Ineffective
</textarea>
            <a href="#" class="es-color-form__show-background-colors">Use distinct rows &amp; columns values</a>
            <a href="#" class="es-color-form__hide-background-colors">Use the same rows &amp; columns values</a>
        </div>

        <div class="es-color-form__field-wrapper">
            <label class="es-color-form__label" for="es-color-form__tile-size-number">Tile Size</label>
            <div class="es-color-form__range-group">
                <input type="range" id="es-color-form__tile-size" name="es-color-form__tile-size" class="es-color-form__range" min="45" max="300" step="1" value="80" aria-label="Tile size slider">
                <input type="number" id="es-color-form__tile-size-number" class="es-color-form__number" min="45" max="300" step="1" value="80">
                <span class="es-color-form__unit">px</span>
            </div>
        </div>

        <div class="es-color-form__field-wrapper">
            <label class="es-color-form__label">Show</label>

            <div class="es-color-form__checkbox-group es-color-form__radio-button-group">
                <label for="es-color-form__show-contrast--aaa" class="es-color-form__radio-button">
                    <input class="es-color-form__radio-button-input" type="checkbox" id="es-color-form__show-contrast--aaa" value="aaa" name="es-color-form__show-contrast">
                    <span class="es-color-form__radio-button-text">
                        AAA
                    </span>
                </label>
                <label for="es-color-form__show-contrast--aa" class="es-color-form__radio-button">
                    <input class="es-color-form__radio-button-input" type="checkbox" id="es-color-form__show-contrast--aa" value="aa" name="es-color-form__show-contrast">
                    <span class="es-color-form__radio-button-text">
                        AA
                    </span>
                </label>
                <label for="es-color-form__show-contrast--aa18" class="es-color-form__radio-button">
                    <input class="es-color-form__radio-button-input" type="checkbox" id="es-color-form__show-contrast--aa18" value="aa18" name="es-color-form__show-contrast">
                    <span class="es-color-form__radio-button-text">
                        AA18
                    </span>
                </label>
                <label for="es-color-form__show-contrast--dnp" class="es-color-form__radio-button">
                    <input class="es-color-form__radio-button-input" type="checkbox" id="es-color-form__show-contrast--dnp" value="dnp" name="es-color-form__show-contrast">
                    <span class="es-color-form__radio-button-text">
                        DNP
                    </span>
                </label>
            </div>
        </div>
    </div>
</form>
