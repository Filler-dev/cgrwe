<div class="cg-contrast-grid">
    <table class="cg-contrast-grid__table">
        <thead>
            <tr class="cg-contrast-grid__foreground-key">
                <th>
                    <div class="cg-contrast-grid__corner">
                        <span class="cg-contrast-grid__corner-background">Background</span>
                        <span>Text</span>
                    </div>
                </th>
            </tr>
        </thead>
        <tbody class="cg-contrast-grid__content"></tbody>
    </table>
</div>
<p class="cg-contrast-grid__status" role="status"></p>

<template class="cg-contrast-grid__foreground-key-cell-template">
    <th class="cg-contrast-grid__foreground-key-cell">
        <div class="cg-contrast-grid__key-swatch cg-contrast-grid__key-swatch--foreground">
            <div class="cg-contrast-grid__key-swatch-label">
                <div class="cg-contrast-grid__key-swatch-label-text"></div>
                <div class="cg-contrast-grid__key-swatch-label-hex"></div>
            </div>
            <div class="cg-contrast-grid__key-swatch-controls">
                <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-copy">
                    <cg-icon name="copy" class="cg-contrast-grid__key-swatch-copy-icon"></cg-icon>
                    <cg-icon name="check" class="cg-contrast-grid__key-swatch-copied-icon"></cg-icon>
                </button>
                <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-remove">
                    <cg-icon name="close"></cg-icon>
                </button>
                <span class="cg-contrast-grid__key-swatch-drag-handle cg-contrast-grid__key-swatch-drag-handle--column">
                    <cg-icon name="grip-horizontal"></cg-icon>
                </span>
            </div>
            <div class="cg-contrast-grid__key-swatch-controls cg-contrast-grid__key-swatch-controls--bottom">
                <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-move" data-direction="left">
                    <cg-icon name="chevron-left"></cg-icon>
                </button>
                <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-move" data-direction="right">
                    <cg-icon name="chevron-right"></cg-icon>
                </button>
            </div>
        </div>
    </th>
</template>

<template class="cg-contrast-grid__content-row-template">
    <tr class="cg-contrast-grid__content-row">
        <th class="cg-contrast-grid__background-key-cell">
            <div class="cg-contrast-grid__key-swatch cg-contrast-grid__key-swatch--background">
                <div class="cg-contrast-grid__key-swatch-label">
                    <div class="cg-contrast-grid__key-swatch-label-text"></div>
                    <div class="cg-contrast-grid__key-swatch-label-hex"></div>
                </div>
                <div class="cg-contrast-grid__key-swatch-controls">
                    <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-move" data-direction="up">
                        <cg-icon name="chevron-up"></cg-icon>
                    </button>
                    <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-move" data-direction="down">
                        <cg-icon name="chevron-down"></cg-icon>
                    </button>
                    <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-copy">
                        <cg-icon name="copy" class="cg-contrast-grid__key-swatch-copy-icon"></cg-icon>
                        <cg-icon name="check" class="cg-contrast-grid__key-swatch-copied-icon"></cg-icon>
                    </button>
                    <button type="button" class="cg-contrast-grid__key-swatch-action cg-contrast-grid__key-swatch-remove">
                        <cg-icon name="close"></cg-icon>
                    </button>
                    <span class="cg-contrast-grid__key-swatch-drag-handle cg-contrast-grid__key-swatch-drag-handle--row">
                        <cg-icon name="grip"></cg-icon>
                    </span>
                </div>
            </div>
        </th>
    </tr>
</template>

<template class="cg-contrast-grid__content-cell-template">
    <td>
        <div class="cg-contrast-grid__tile">
            <button type="button" class="cg-contrast-grid__suggest">
                <cg-icon name="suggest"></cg-icon>
            </button>
            <span class="cg-contrast-grid__tile-text">Text</span>
            <div class="cg-contrast-grid__tile-stats">
                <span class="cg-contrast-grid__level-badge"></span>
                <span class="cg-contrast-grid__contrast-ratio"></span>
            </div>
        </div>
    </td>
</template>
